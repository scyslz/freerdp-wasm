name: Build and publish wsproxy binary

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            artifact: wsproxy-linux-amd64
          - arch: arm64
            artifact: wsproxy-linux-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: proxy/go.sum

      - name: Fetch latest frontend and patch (once, shared)
        run: |
          ./scripts/fetch-client.sh
          ./scripts/patch-client.sh
          echo "tag=$(cat proxy/site/CLIENT)" >> "$GITHUB_ENV"

      - name: Cross-compile ${{ matrix.arch }}
        env:
          GOARCH: ${{ matrix.arch }}
          GOOS: linux
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist-release
          (cd proxy && go build -trimpath -ldflags="-s -w" -o "../dist-release/${{ matrix.artifact }}" .)
          sha256sum "dist-release/${{ matrix.artifact }}" > "dist-release/${{ matrix.artifact }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist-release/${{ matrix.artifact }}
            dist-release/${{ matrix.artifact }}.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'wsproxy latest' }}
          body: |
            Single-file browser RDP proxy binary (Go + embedded FreeRDP WASM client).

            - Built from commit: `${{ github.sha }}`
            - Assets: linux-amd64, linux-arm64 (statically linked, Go 1.27)

            Run: `./wsproxy-linux-<arch> -listen 0.0.0.0:8180 -target <RDS_HOST>:3389`
          files: |
            release-assets/wsproxy-linux-amd64
            release-assets/wsproxy-linux-amd64.sha256
            release-assets/wsproxy-linux-arm64
            release-assets/wsproxy-linux-arm64.sha256
          draft: false
          prerelease: false
