name: Build and publish wsproxy binary

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: proxy/go.sum

      - name: Record upstream client version
        id: upstream
        run: |
          # build.sh fetches the newest upstream kit and re-applies our patch.
          # Capture the resulting tag so the release notes say what was built.
          ./build.sh dist-release/wsproxy
          echo "tag=$(cat proxy/site/CLIENT)" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum dist-release/wsproxy | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h dist-release/wsproxy | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Package binary
        run: |
          cp dist-release/wsproxy wsproxy-linux-amd64
          (cd dist-release && sha256sum wsproxy > ../wsproxy-linux-amd64.sha256)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # On every push to main, update the rolling "latest" release.
          # On v* tags, create a versioned release instead.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'wsproxy latest' }}
          body: |
            Single-file browser RDP proxy binary (Go + embedded FreeRDP WASM client).

            - Upstream client kit: `${{ steps.upstream.outputs.tag }}`
            - Built from commit: `${{ github.sha }}`
            - Binary SHA-256: `${{ steps.upstream.outputs.sha }}`
            - Size: `${{ steps.upstream.outputs.size }}`

            Run: `./wsproxy-linux-amd64 -listen 0.0.0.0:8180 -target <RDS_HOST>:3389`
          files: |
            wsproxy-linux-amd64
            wsproxy-linux-amd64.sha256
          draft: false
          prerelease: false
